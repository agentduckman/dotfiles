# ---------- Window ----------
# Alacritty: [window] padding = { x = 5, y = 5 }
window_padding_width 0
# window_padding_width 4

# Alacritty: opacity = 0.8
background_opacity 0.7


# ---------- Font ----------
# Alacritty: [font] size = 15
font_size 15.0

# Alacritty: offset.y = -2  (nudges glyphs vertically)
# Kitty equivalent: baseline tweaks vertical font alignment
baseline -2


# ---------- Selection ----------
# Alacritty: [selection] save_to_clipboard = true
copy_on_select yes


# ---------- Shell ----------
# Alacritty: [terminal.shell] program = "tmux"
shell tmux


# ---------- Cursor ----------
# Alacritty: [cursor] blink_interval = 500  (ms)
# Kitty uses seconds:
cursor_blink_interval 0.5

# Alacritty: [cursor.style] shape = "Block", blinking = "Always"
cursor_shape block

