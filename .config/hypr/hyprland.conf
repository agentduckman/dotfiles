################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto
source = ~/.config/hypr/monitors.conf
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/display-reconcile.sh
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/display-reconcile.sh

exec-once = ~/.config/hypr/display-reconcile.sh

###################
### MY PROGRAMS ###
###################

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = fuzzel
$browser = brave
$mailclient = thunderbird
$notes = obsidian

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:
exec-once = /usr/bin/dunst

# Clipboard history on Wayland (rofi-greenclip alternative):
#  - pacman -S cliphist wl-clipboard
exec-once = cliphist wipe
exec-once = wl-paste --watch cliphist store

# Rofi (Wayland build) & daemon (greenclip replacement not needed with cliphist):
# rofi-wayland provides 'rofi'
#exec-once = rofi -modi drun -show drun -config ~/.config/rofi/rofidmenu.rasi

# Wallpaper: use hyprpaper (recommended) or swww
exec-once = hyprpaper

# XDG autostart (optional; many entries are X11-centric—use sparingly)
#exec-once = dex --autostart --environment Hyprland

# Proton Mail Bridge headless
exec-once = protonmail-bridge-core --noninteractive


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# Refer to https://wiki.hypr.land/Configuring/Variables/

cursor {
    no_warps = true
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
	col.active_border = rgba(AF5FAFee) rgba(875FAFee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false
    layout = dwindle

    resize_on_border = true
    extend_border_grab_area = 20   # easier to grab edges
    hover_icon_on_border = true
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}


# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    disable_splash_rendering = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:escape
    kb_rules =

    follow_mouse = 0

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod SHIFT, SPACE, togglefloating

# Resize "mode" via submap, arrows mirror your i3 bindings
bind = $mainMod, R, submap, resize
submap = resize
  binde = , LEFT,  resizeactive, -20 0
  binde = , RIGHT, resizeactive,  20 0
  binde = , UP,    resizeactive,  0 -20
  binde = , DOWN,  resizeactive,  0  20
  bind  = , RETURN, submap, reset
  bind  = , ESCAPE, submap, reset
submap = reset

# Workspace cycling
bind = $mainMod SHIFT, LEFT, workspace, -1
bind = $mainMod SHIFT, RIGHT, workspace, +1

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, X, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, ESCAPE, exec, hyprlock
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, B, exec, $browser 
bind = $mainMod, O, exec, $notes 
bind = $mainMod, P, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod, DELETE, exec, /home/duck/.config/hypr/hypr-power-menu.sh
bind = $mainMod, T, exec, $mailclient
bind = $mainMod, I, exec, $browser --incognito
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, INSERT, exec, hyprctl dispatch exec "[float; size 1000 700; center] /home/duck/Scripts/procs.sh"
bind = $mainMod, END, exec, /home/duck/.config/hypr/hypr-vpn-select.sh
bind = $mainMod, Q, exec, "dpms fired $(date)" >> /tmp/hypr-dpms.log && hyprctl dispatch dpms on
bind = $mainMod, D, exec, /home/duck/.config/hypr/display-reconcile.sh

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Switch window tiling vertical/horizontal
bind = $mainMod, \, togglesplit

# Move windows
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspacesilent, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
  name = float-proton-mail-bridge
  match:class = ^(Proton Mail Bridge)$
  float = on
}

windowrule {
  name = float-dunst
  match:title = ^(Dunst)$
  float = on
}

windowrule {
  name = float-proton-vpn
  match:title = ^(Proton VPN)$
  float = on
}

windowrule {
  name = float-extract-archive
  match:title = ^(Extract archive)$
  float = on
}

windowrule {
  name = float-enter-user-password
  match:title = ^(Enter the user password:)$
  float = on
}

windowrule {
  name = float-error-loading-icons
  match:title = ^(Error loading icons)$
  float = on
}

windowrule {
  name = thunar-float-size-center
  match:class = ^(thunar)$
  float = on
  size = 1200 750
  center = on
}

windowrule {
  name = proton-pass-workspace-10
  match:class = ^(Proton Pass)$
  workspace = 10 silent
}


windowrule {
  name = float-Terraria
  match:title = Terraria
  float = on
  size = 2048 1152
  center = on
}

exec-once = waybar
env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/keyring/ssh
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1


