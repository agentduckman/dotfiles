############################
### HYPRLAND TEST CONFIG ###
############################
# Generated from Ducky's existing config.
# Goal: same workflow, same palette family, cleaner syntax, smoother polish.
# Test safely:
#   cp ~/.config/hypr/hyprland.conf ~/.config/hypr/hyprland.conf.bak.$(date +%F-%H%M%S)
#   cp hyprland-polished-test.conf ~/.config/hypr/hyprland.conf
#   hyprctl reload
#   hyprctl configerrors

################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto
source = ~/.config/hypr/monitors.conf

bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/display-reconcile.sh
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/display-reconcile.sh

exec-once = ~/.config/hypr/display-reconcile.sh


###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = thunar
$menu = fuzzel
$browser = brave-origin-nightly
$mailclient = thunderbird
$notes = obsidian


#################
### AUTOSTART ###
#################

exec-once = /usr/bin/dunst
exec-once = waybar

# Clipboard history on Wayland:
exec-once = clipse -listen


# Wallpaper
exec-once = hyprpaper

# Proton Mail Bridge headless
exec-once = protonmail-bridge-core --noninteractive


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland


############
### LOOK ###
############

cursor {
    no_warps = true
}

general {
    gaps_in = 5
    gaps_out = 10
    float_gaps = 10
    border_size = 2

    # Palette preserved; inactive alpha slightly reduced for focus contrast.
    col.active_border = rgba(AF5FAFee) rgba(875FAFee) 45deg
    col.inactive_border = rgba(59595988)

    resize_on_border = true
    extend_border_grab_area = 20
    hover_icon_on_border = true

    allow_tearing = false
    layout = dwindle

    # Floating-window snapping. Useful for Thunar/dialogs/utility floats.
    snap {
        enabled = true
        window_gap = 10
        monitor_gap = 10
        respect_gaps = true
    }
}

decoration {
    rounding = 10
    rounding_power = 2.5

    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    # Subtle focus depth without making inactive terminals translucent.
    dim_inactive = true
    dim_strength = 0.06
    dim_special = 0.18

    shadow {
        enabled = true
        range = 10
        render_power = 3
        color = rgba(1a1a1aaa)
        color_inactive = rgba(1a1a1a66)
        offset = 0 2
        scale = 0.97
    }

    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        xray = true

        noise = 0.0117
        contrast = 0.90
        brightness = 0.85
        vibrancy = 0.1696

        # Keep expensive blur surfaces off unless you specifically want them.
        special = false
        popups = false
        input_methods = false
    }
}

animations {
    enabled = true
    workspace_wraparound = true

    # Curves
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Windows
    animation = global,      1, 10, default
    animation = windows,     1, 4,  easeOutQuint
    animation = windowsIn,   1, 4,  easeOutQuint, popin 87%
    animation = windowsOut,  1, 2,  quick,        popin 87%
    animation = windowsMove, 1, 3,  easeOutQuint

    # Borders and fades
    animation = border,      1, 5,  easeOutQuint
    animation = fade,        1, 3,  quick
    animation = fadeIn,      1, 2,  almostLinear
    animation = fadeOut,     1, 2,  almostLinear
    animation = fadeDim,     1, 3,  quick

    # Layers
    animation = layers,      1, 4,  easeOutQuint
    animation = layersIn,    1, 4,  easeOutQuint, fade
    animation = layersOut,   1, 2,  quick,        fade
    animation = fadeLayers,  1, 3,  quick

    # Workspaces: more pleasant than plain fades, not ridiculous.
    animation = workspaces,        1, 4, easeOutQuint, slidefade -20%
    animation = specialWorkspace,  1, 5, easeOutQuint, slidefadevert 20%

    animation = zoomFactor,  1, 7, quick

    # Intentionally no borderangle loop; it costs constant rendering/battery.
}


###############
### LAYOUTS ###
###############

dwindle {
    preserve_split = true
}

master {
    new_status = master
}


############
### MISC ###
############

misc {
    force_default_wallpaper = 1
    disable_hyprland_logo = true
    disable_splash_rendering = true


    # Smooth manual resize operations; keep mouse drag animation off to avoid weird curve behavior.
    animate_manual_resizes = true
    animate_mouse_windowdragging = true

    close_special_on_empty = true
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:escape
    kb_rules =

    follow_mouse = 0
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
# gesture = 3, horizontal, workspace
#
# device {
#     name = epic-mouse-v1
#     sensitivity = -0.5
# }


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod SHIFT, SPACE, togglefloating

# Resize mode
bind = $mainMod, R, submap, resize
submap = resize
  binde = , LEFT,  resizeactive, -20 0
  binde = , RIGHT, resizeactive,  20 0
  binde = , UP,    resizeactive,  0 -20
  binde = , DOWN,  resizeactive,  0  20
  bind  = , RETURN, submap, reset
  bind  = , ESCAPE, submap, reset
submap = reset

# Workspace cycling
bind = $mainMod SHIFT, LEFT, workspace, -1
bind = $mainMod SHIFT, RIGHT, workspace, +1

# Launchers / apps
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, X, killactive,
bind = SUPER, V, exec, $terminal --class clipse -e 'clipse'
bind = $mainMod, ESCAPE, exec, hyprlock
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod, O, exec, $notes
bind = $mainMod, P, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod, DELETE, exec, /home/duck/.config/hypr/hypr-power-menu.sh
bind = $mainMod, T, exec, $mailclient
bind = $mainMod, I, exec, $browser --incognito
bind = $mainMod, INSERT, exec, hyprctl dispatch exec "[float; size 1000 700; center] /home/duck/Scripts/procs.sh"
bind = $mainMod, END, exec, /home/duck/.config/hypr/hypr-vpn-select.sh
bind = $mainMod, D, exec, /home/duck/.config/hypr/display-reconcile.sh

# Move focus with mainMod + H/J/K/L
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Switch window tiling vertical/horizontal
bind = $mainMod, \, layoutmsg, togglesplit

# Move windows
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Special workspace / scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspacesilent, special:magic

# Scroll through existing workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################
windowrule {
  name = float-clipse
  match:class = ^(clipse)
  float = on
  size = 790 700
}

windowrule {
  name = float-galculator
  match:class = ^(galculator)$
  float = on
}

windowrule {
  name = float-proton-mail-bridge
  match:class = ^(Proton Mail Bridge)$
  float = on
}

windowrule {
  name = float-dunst
  match:title = ^(Dunst)$
  float = on
}

windowrule {
  name = float-proton-vpn
  match:title = ^(Proton VPN)$
  float = on
}

windowrule {
  name = float-extract-archive
  match:title = ^(Extract archive)$
  float = on
}

windowrule {
  name = float-enter-user-password
  match:title = ^(Enter the user password:)$
  float = on
}

windowrule {
  name = float-error-loading-icons
  match:title = ^(Error loading icons)$
  float = on
}

windowrule {
  name = thunar-float-size-center
  match:class = ^(thunar)$
  float = on
  size = 1200 750
  center = on
}

windowrule {
  name = proton-pass-workspace-10
  match:class = ^(Proton Pass)$
  workspace = 10 silent
}

windowrule {
  name = float-Terraria
  match:title = Terraria
  float = on
  size = 2048 1152
  center = on
}
